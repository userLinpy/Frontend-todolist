name: Build Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: app
        run: mvn clean package -DskipTests

      - name: Create Windows installer (.exe)
        working-directory: app
        run: |
          jpackage `
            --module-path "target/libs;target/app-1.0-SNAPSHOT.jar" `
            --module com.ghibli.todolist/com.ghibli.todolist.Launcher `
            --add-modules jdk.crypto.ec,jdk.crypto.cryptoki `
            --dest installer `
            --name "Totoro ToDoList" `
            --type exe `
            --app-version 1.3 `
            --vendor "Ghibli Dev" `
            --icon "target/classes/background.ico" `
            --win-shortcut `
            --win-menu

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/installer/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: app
        run: mvn clean package -DskipTests

      - name: Create macOS installer (.dmg)
        working-directory: app
        run: |
          jpackage \
            --module-path "target/libs:target/app-1.0-SNAPSHOT.jar" \
            --module com.ghibli.todolist/com.ghibli.todolist.Launcher \
            --add-modules jdk.crypto.ec,jdk.crypto.cryptoki \
            --dest installer \
            --name "Totoro ToDoList" \
            --type dmg \
            --app-version 1.3 \
            --vendor "Ghibli Dev" \
            --icon "target/classes/background.icns"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: app/installer/*.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installers/

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: installers/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          name: "Totoro ToDoList ${{ github.ref_name }}"
          token: ${{ secrets.RELEASE_TOKEN }}
          body: |
            ## Totoro ToDoList ${{ github.ref_name }}

            ### Téléchargement
            - **Windows** : téléchargez le fichier `.exe` et lancez l'installeur
            - **macOS** : téléchargez le fichier `.dmg`, ouvrez-le et glissez l'app dans Applications
